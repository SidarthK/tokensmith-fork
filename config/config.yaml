embed_model: "models/embedders/Qwen3-Embedding-4B-Q5_K_M.gguf"
embedding_model_context_window: 4096

top_k: 10
num_candidates: 50
ensemble_method: "rrf"
ranker_weights: {"faiss":0.7,"bm25":0.3,"index_keywords":0.0}
rrf_k: 60
max_gen_tokens: 400
chunk_mode : "recursive_sections"
gen_model: "models/generators/qwen2.5-1.5b-instruct-q8_0.gguf"
chunk_size_in_chars: 2000
chunk_overlap: 200
use_hyde: false
hyde_max_tokens: 300
use_indexed_chunks: false
rerank_mode: "cross_encoder"
rerank_top_k: 5
rerank_candidate_pool: 20
coverage_mmr_candidate_pool: 40
coverage_mmr_lambda: 0.6
coverage_mmr_similarity_metric: "cosine"
use_query_decomposition: false
decomposition_max_subquestions: 4
decomposition_candidate_pool: 12
decomposition_merge_strategy: "union_max"
coverage_subquestion_weight: 0.35
use_double_prompt: false
enable_history: true
max_history_turns: 3
semantic_cache_enabled: false
semantic_cache_bi_encoder_threshold: 0.90
semantic_cache_cross_encoder_threshold: 0.99
enable_topic_extraction: false
