benchmarks:
  - id: "singlehop_fd_meaning"
    family: "singlehop"
    topic: "normalization"
    question: "What does a functional dependency X -> Y assert about tuples in a relation?"
    expected_answer: "A functional dependency X -> Y means that whenever two tuples agree on X, they must also agree on Y, so X determines the value of Y."
    keywords: ["functional dependency", "agree on X", "agree on Y", "determines"]
    similarity_threshold: 0.72
    ideal_retrieved_chunks: [378, 379, 380]
    ideal_retrieved_pages: [481, 482, 483, 484, 485]

  - id: "singlehop_bplus_lookup_efficiency"
    family: "singlehop"
    topic: "indexing"
    question: "Why do B+ trees keep point lookups efficient on disk?"
    expected_answer: "B+ trees have high fan-out and are balanced, so the tree stays shallow and a lookup touches only a few disk blocks; the root is often cached, reducing I/O further."
    keywords: ["B+ tree", "fan-out", "balanced", "shallow", "disk blocks"]
    similarity_threshold: 0.72
    ideal_retrieved_chunks: [821, 822, 826, 827]
    ideal_retrieved_pages: [974, 975, 976, 981, 983]

  - id: "singlehop_wal_rule"
    family: "singlehop"
    topic: "recovery"
    question: "What does the write-ahead logging rule require before a modified database page is written?"
    expected_answer: "Write-ahead logging requires the relevant log records, especially the undo information, to be forced to stable storage before the modified page itself is written to disk."
    keywords: ["write-ahead logging", "stable storage", "log records", "before page write", "undo information"]
    similarity_threshold: 0.73
    ideal_retrieved_chunks: [1216, 1217, 1219, 1220]
    ideal_retrieved_pages: [1431, 1432, 1433, 1434, 1435, 1436]

  - id: "procedure_fd_lossless_condition"
    family: "procedure"
    topic: "normalization"
    question: "How do functional dependencies tell you whether a decomposition is lossless?"
    expected_answer: "A decomposition of R into R1 and R2 is lossless if the common attributes R1 intersection R2 functionally determine R1 or R2; equivalently, the intersection is a superkey for one of the decomposed relations."
    keywords: ["lossless decomposition", "functional dependencies", "intersection", "superkey", "R1", "R2"]
    similarity_threshold: 0.74
    ideal_retrieved_chunks: [374, 382, 383]
    ideal_retrieved_pages: [477, 478, 479, 485, 486, 487]

  - id: "procedure_3nf_dependency_preservation"
    family: "procedure"
    topic: "normalization"
    question: "Why can the 3NF synthesis algorithm preserve dependencies yet still rely on a key-based argument to guarantee losslessness?"
    expected_answer: "The 3NF synthesis algorithm preserves dependencies by building schemas from a canonical cover, but it guarantees losslessness by ensuring that at least one resulting schema contains a candidate key for the original relation."
    keywords: ["3NF", "dependency preservation", "canonical cover", "candidate key", "lossless"]
    similarity_threshold: 0.75
    ideal_retrieved_chunks: [382, 418, 420, 421]
    ideal_retrieved_pages: [485, 486, 516, 517, 518, 519, 520]

  - id: "tradeoff_bplus_sort_join"
    family: "tradeoff"
    topic: "indexing_and_joins"
    question: "How do B+ tree indexing and sorted inputs help disk-based join processing, and where do write costs still show up?"
    expected_answer: "B+ trees keep lookups and range access efficient with shallow balanced trees, while sorted inputs let merge join scan relations with few block reads. The tradeoff is that maintaining a B+ tree during inserts and deletes can require splits, coalescing, and extra writes."
    keywords: ["B+ tree", "sorted inputs", "merge join", "disk-based", "updates", "splits"]
    similarity_threshold: 0.74
    ideal_retrieved_chunks: [826, 827, 829, 920, 922]
    ideal_retrieved_pages: [981, 983, 984, 1087, 1090, 1091]

  - id: "tradeoff_serializable_vs_read_committed"
    family: "tradeoff"
    topic: "concurrency"
    question: "Why is serializable stronger than read committed, and what locking tradeoff comes with enforcing it?"
    expected_answer: "Serializable requires behavior equivalent to some serial order, preventing anomalies that read committed still allows. Enforcing serializable behavior with locking requires transactions to hold locks long enough to preserve serializability, which reduces concurrency."
    keywords: ["serializable", "read committed", "serial order", "anomalies", "locking", "concurrency"]
    similarity_threshold: 0.75
    ideal_retrieved_chunks: [1074, 1075, 1079, 1080, 1094]
    ideal_retrieved_pages: [1263, 1264, 1267, 1269, 1295, 1296]

  - id: "tradeoff_snapshot_read_heavy"
    family: "tradeoff"
    topic: "concurrency"
    question: "Why is snapshot isolation attractive for long read-heavy queries, and why can it still fail to guarantee serializability?"
    expected_answer: "Snapshot isolation lets transactions read from a private committed snapshot, so long read-heavy queries do not block updates. But it is still weaker than serializable execution because concurrent transactions can observe stale snapshots and produce anomalies unless extra checks are applied."
    keywords: ["snapshot isolation", "read-heavy", "private snapshot", "serializability", "anomalies"]
    similarity_threshold: 0.75
    ideal_retrieved_chunks: [1082, 1143, 1148, 1154]
    ideal_retrieved_pages: [1270, 1271, 1345, 1346, 1349, 1350, 1355, 1356]

  - id: "procedure_wal_atomicity_durability"
    family: "procedure"
    topic: "recovery"
    question: "How do WAL and redo/undo together support atomicity and durability after failures?"
    expected_answer: "WAL ensures log records reach stable storage before data pages, giving recovery enough information to redo committed updates and undo incomplete ones. Redo preserves durability for committed transactions, while undo preserves atomicity by removing partial effects."
    keywords: ["WAL", "redo", "undo", "atomicity", "durability", "stable storage"]
    similarity_threshold: 0.76
    ideal_retrieved_chunks: [1201, 1202, 1217]
    ideal_retrieved_pages: [1418, 1419, 1420, 1421, 1433]

  - id: "procedure_aries_recovery_pipeline"
    family: "procedure"
    topic: "recovery"
    question: "How does ARIES move from analysis to redo to undo after a crash?"
    expected_answer: "ARIES first performs analysis to identify dirty pages, loser transactions, and RedoLSN. It then redoes history forward from RedoLSN and finally scans backward to undo incomplete transactions, using compensation log records and transaction log links to continue rollback correctly."
    keywords: ["ARIES", "analysis", "RedoLSN", "redo", "undo", "compensation log record"]
    similarity_threshold: 0.76
    ideal_retrieved_chunks: [1242, 1247, 1248, 1249, 1250]
    ideal_retrieved_pages: [1457, 1458, 1461, 1462, 1463]

  - id: "compare3_oltp_warehouse_olap_sql"
    family: "compare3"
    topic: "analytics"
    question: "How do OLTP systems, data warehouses, and OLAP-style SQL differ in workload shape, latency goals, and schema assumptions?"
    expected_answer: "OLTP focuses on many short update-heavy transactions with strict response-time goals. Data warehouses gather and organize data for analysis using fact and dimension tables, while OLAP-style SQL supports interactive multidimensional aggregation across many related groupings that basic transaction-oriented SQL workloads do not emphasize."
    keywords: ["OLTP", "data warehouse", "OLAP", "fact table", "dimension table", "latency", "interactive"]
    similarity_threshold: 0.76
    ideal_retrieved_chunks: [661, 669, 683, 684, 685, 1661]
    ideal_retrieved_pages: [782, 801, 815, 816, 817, 818, 1921, 1922]

  - id: "tradeoff_recoverable_vs_strict_2pl"
    family: "tradeoff"
    topic: "concurrency"
    question: "How does strict two-phase locking improve on merely recoverable schedules when cascading failures are possible?"
    expected_answer: "Recoverable schedules only ensure a writer commits before dependent readers commit, but cascading rollback can still occur if uncommitted data are read. Strict two-phase locking keeps exclusive locks until commit, preventing reads of uncommitted writes and thereby avoiding cascading rollbacks."
    keywords: ["recoverable", "strict two-phase locking", "cascading rollback", "exclusive locks", "uncommitted writes"]
    similarity_threshold: 0.76
    ideal_retrieved_chunks: [1072, 1073, 1095, 1097]
    ideal_retrieved_pages: [1261, 1262, 1296, 1297, 1299]

  - id: "procedure_aries_redo_vs_undo_paths"
    family: "procedure"
    topic: "recovery"
    question: "How does ARIES decide where redo begins, and why does undo follow a different path through the log?"
    expected_answer: "During analysis ARIES sets RedoLSN to the minimum RecLSN in the DirtyPageTable, so redo can scan forward from the earliest page that may need repeating. Undo follows transaction-specific backward chains using PrevLSN and UndoNextLSN because it only rolls back loser transactions rather than replaying all history."
    keywords: ["RedoLSN", "DirtyPageTable", "PrevLSN", "UndoNextLSN", "redo", "undo"]
    similarity_threshold: 0.77
    ideal_retrieved_chunks: [1246, 1248, 1249, 1250]
    ideal_retrieved_pages: [1460, 1461, 1462, 1463]

  - id: "procedure_fuzzy_checkpointing_in_aries"
    family: "procedure"
    topic: "recovery"
    question: "Why does ARIES use fuzzy checkpointing, and how does the analysis pass compensate for incomplete checkpoints?"
    expected_answer: "ARIES uses fuzzy checkpointing to avoid pausing updates while a checkpoint flushes pages to disk. Because pages may still be dirty when a crash happens, the analysis pass reads the last completed checkpoint, rebuilds the DirtyPageTable and undo-list, and computes RedoLSN so recovery can safely continue."
    keywords: ["fuzzy checkpointing", "DirtyPageTable", "analysis pass", "RedoLSN", "last completed checkpoint"]
    similarity_threshold: 0.77
    ideal_retrieved_chunks: [1205, 1223, 1243, 1248]
    ideal_retrieved_pages: [1422, 1423, 1424, 1438, 1439, 1458, 1462, 1463]

  - id: "tradeoff_snapshot_vs_strict_2pl_reads"
    family: "tradeoff"
    topic: "concurrency"
    question: "Why can snapshot isolation support long read transactions better than strict two-phase locking, and what correctness risk remains?"
    expected_answer: "Snapshot isolation lets readers use a private committed snapshot, so long reads do not block writers the way strict two-phase locking can. The tradeoff is that snapshot isolation can still allow nonserializable executions and must validate constraints or updates against the current database state at commit time."
    keywords: ["snapshot isolation", "strict two-phase locking", "long reads", "nonserializable", "validation"]
    similarity_threshold: 0.77
    ideal_retrieved_chunks: [1082, 1097, 1148, 1154]
    ideal_retrieved_pages: [1270, 1271, 1299, 1349, 1350, 1355, 1356]

  - id: "procedure_warehouse_schema_and_olap_sql"
    family: "procedure"
    topic: "analytics"
    question: "How do fact/dimension warehouse schemas support OLAP, and why does OLAP SQL need more than basic GROUP BY?"
    expected_answer: "Warehouse schemas organize analysis around large fact tables and dimension tables so aggregates can be sliced by multiple dimensions. OLAP queries often need many related groupings across subsets of dimensions, which basic GROUP BY cannot express in one query, so OLAP SQL adds specialized constructs and optimizations for interactive multidimensional analysis."
    keywords: ["fact tables", "dimension tables", "OLAP", "GROUP BY", "multiple groupings", "interactive"]
    similarity_threshold: 0.77
    ideal_retrieved_chunks: [669, 678, 683, 684, 685]
    ideal_retrieved_pages: [801, 809, 810, 811, 815, 816, 817, 818]

  - id: "bridge_query_processor_to_join_order"
    family: "bridge"
    topic: "query_optimization"
    question: "How does the query processor bridge from a declarative query to a physical join plan, and why does join ordering matter in that process?"
    expected_answer: "The query processor translates declarative queries into evaluation plans using lower-level operations, and the optimizer then compares alternative equivalent plans. Join ordering matters because different orders can change the size of intermediate results dramatically, which changes the cost of the physical plan chosen for execution."
    keywords: ["query processor", "evaluation plan", "optimizer", "join ordering", "intermediate results"]
    similarity_threshold: 0.77
    ideal_retrieved_chunks: [34, 970, 980, 982]
    ideal_retrieved_pages: [76, 1145, 1146, 1159, 1160, 1161, 1162, 1163]

  - id: "compare3_join_algorithms_disk"
    family: "compare3"
    topic: "query_optimization"
    question: "Compare nested-loop join, merge join, and hash join for disk-resident data in terms of prerequisites, I/O behavior, and when an optimizer would prefer each one."
    expected_answer: "Nested-loop join works with minimal prerequisites but can incur many repeated scans, especially if no useful index exists. Merge join prefers inputs sorted on the join attributes and then reads both relations largely sequentially, while hash join partitions inputs by join key and is attractive for equijoins when sorted order is unavailable. An optimizer chooses among them based on ordering, available memory, indexes, and expected I/O cost."
    keywords: ["nested-loop join", "merge join", "hash join", "sorted inputs", "equijoin", "I/O cost"]
    similarity_threshold: 0.78
    ideal_retrieved_chunks: [914, 915, 920, 922, 926, 927]
    ideal_retrieved_pages: [1081, 1082, 1087, 1090, 1091, 1094, 1095, 1096, 1097]

  - id: "application_phantom_predicate_reads"
    family: "application"
    topic: "concurrency"
    question: "Suppose a transaction counts all instructors in one department while another transaction inserts a matching tuple. Why is this a phantom problem, and what stronger isolation machinery is needed to prevent it?"
    expected_answer: "This is a phantom problem because the first transaction is effectively reading a predicate-defined set of tuples, and the concurrent insert creates a new tuple that newly satisfies that predicate. Preventing the anomaly requires serializable behavior with predicate-aware locking or equivalent mechanisms, not just item-level locks or weaker isolation levels."
    keywords: ["phantom", "predicate reads", "serializable", "predicate locking", "insert", "anomaly"]
    similarity_threshold: 0.78
    ideal_retrieved_chunks: [1075, 1084, 1085, 1094, 1120, 1121]
    ideal_retrieved_pages: [1264, 1272, 1273, 1295, 1296, 1322, 1323, 1324]

  - id: "cross_section_er_to_relational_integrity"
    family: "cross_section"
    topic: "schema_design"
    question: "How do relationship sets, mapping cardinalities, and foreign keys work together when reducing an E-R design to relational schemas that preserve integrity?"
    expected_answer: "Relationship sets describe associations among entity sets, while mapping cardinalities constrain how many entities can participate in those associations. When the E-R design is reduced to relational schemas, primary-key attributes from participating entities become attributes of relationship relations or are absorbed into entity relations where appropriate, and foreign keys preserve the referenced connections and integrity constraints in the relational design."
    keywords: ["relationship sets", "mapping cardinalities", "foreign keys", "E-R", "relational schemas", "integrity"]
    similarity_threshold: 0.78
    ideal_retrieved_chunks: [58, 298, 306, 312, 329, 333]
    ideal_retrieved_pages: [113, 114, 388, 389, 397, 398, 403, 404, 420, 421, 424, 425]

  - id: "tradeoff_isolation_levels_for_analytics"
    family: "tradeoff"
    topic: "concurrency"
    question: "For long analytical reads running alongside updates, how do read committed, serializable, and snapshot isolation differ in accuracy versus concurrency?"
    expected_answer: "Read committed offers high concurrency but can return inconsistent results because a long query may see different committed states at different times. Serializable gives the strongest correctness guarantee but often requires stronger locking or validation that reduces concurrency, while snapshot isolation keeps long reads nonblocking and consistent with a committed snapshot but can still allow nonserializable outcomes."
    keywords: ["read committed", "serializable", "snapshot isolation", "long analytical reads", "concurrency", "accuracy"]
    similarity_threshold: 0.78
    ideal_retrieved_chunks: [1074, 1082, 1148, 1154, 1661]
    ideal_retrieved_pages: [1263, 1264, 1270, 1271, 1349, 1350, 1355, 1356, 1921, 1922]

  - id: "cross_section_er_cardinality_schema_combination"
    family: "cross_section"
    topic: "schema_design"
    question: "How do mapping cardinality and total participation justify combining schemas when reducing some E-R relationships to relations?"
    expected_answer: "If a many-to-one relationship has total participation on the many side, every entity on that side must participate in the relationship and the relationship adds no optional extra tuple structure of its own. In that case the relationship attributes and referenced key can be absorbed into the participating entity relation, combining schemas without losing the cardinality information."
    keywords: ["mapping cardinality", "total participation", "combine schemas", "many-to-one", "E-R reduction"]
    similarity_threshold: 0.77
    ideal_retrieved_chunks: [58, 306, 312, 333, 334]
    ideal_retrieved_pages: [113, 114, 397, 398, 403, 404, 424, 425]
